name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Run this workflow from the main branch." >&2
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be plain semver like 0.2.0" >&2
            exit 1
          fi

          LATEST_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1 || true)
          LATEST=${LATEST_TAG#v}
          if [ -n "$LATEST" ] && [ "$LATEST" != "$VERSION" ]; then
            if [ "$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
              echo "Version $VERSION must be greater than the latest tag $LATEST" >&2
              exit 1
            fi
          fi

          echo "Releasing version $VERSION"

      - name: Run tests
        run: npm test

      - name: Bump, commit and tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PKG_VERSION=$(node -p "require('./package.json').version")

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "Tag v$VERSION exists but package.json says $PKG_VERSION" >&2
              exit 1
            fi
            echo "Version already tagged; skipping the bump."
          else
            if [ "$PKG_VERSION" = "$VERSION" ]; then
              echo "package.json already has version $VERSION; skipping the bump."
              git tag -a "v$VERSION" -m "chore: release v$VERSION"
            elif [ "$(printf '%s\n%s\n' "$PKG_VERSION" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]; then
              echo "package.json version $PKG_VERSION must be lower than $VERSION" >&2
              exit 1
            else
              npm version "$VERSION" -m "chore: release v%s"
            fi

            git push origin HEAD:main
            git push origin "v$VERSION"
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists."
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi
